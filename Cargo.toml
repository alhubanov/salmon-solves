[package]
name = "crossy"
version = "0.1.0"
edition = "2024"

[dependencies]
num = "0.4"
rand = "0.10.1"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive", "rc"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
ahash = { version = "0.8.12", default-features = false, features = ["std", "compile-time-rng"] }
chacha20 = "0.10.1"
fixedbitset = "0.5.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
perfcnt = "0.8.0"
criterion-perf-events = "0.4.0"

[lib]
crate-type = ["cdylib", "rlib"]
bench = false

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "criterion_benchmark"
harness = false

[[bin]]
name = "crossy"
path = "src/main.rs"
bench = false

